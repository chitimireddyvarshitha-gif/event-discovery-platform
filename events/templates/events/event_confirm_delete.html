{% extends 'base.html' %}

{% block title %}Delete Event — {{ event.event_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5">
        <div class="card card-premium p-4 border-0 shadow-lg">
            <div class="card-body text-center">
                <div class="bg-danger bg-opacity-10 text-danger p-3 rounded-circle d-inline-flex align-items-center justify-content-center mb-4" style="width: 70px; height: 70px;">
                    <i class="bi bi-exclamation-triangle-fill fs-2"></i>
                </div>
                
                <h2 class="h4 fw-extrabold text-dark mb-3">Delete Event?</h2>
                <p class="text-secondary small mb-4">Are you absolutely sure you want to delete <span class="fw-bold text-dark">"{{ event.event_name }}"</span>? This action is permanent and cannot be undone.</p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-danger py-3 fw-bold rounded-3 shadow-sm">
                            <i class="bi bi-trash3-fill me-2"></i> Yes, Delete Event
                        </button>
                        <a class="btn btn-light border py-2 mt-2 rounded-3" href="{% url 'events:detail' event.id %}">
                            Cancel & Go Back
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
