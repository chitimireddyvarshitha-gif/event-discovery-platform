{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Change Password — EventHub{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-lg-6 col-md-8">
        <div class="card card-premium p-4 border-0 shadow-lg">
            <div class="card-body">
                <div class="text-center mb-4">
                    <div class="bg-primary bg-opacity-10 text-primary p-3 rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 70px; height: 70px;">
                        <i class="bi bi-key-fill fs-2"></i>
                    </div>
                    <h2 class="h4 fw-extrabold text-dark">Change Password</h2>
                    <p class="text-muted small">Update your account password. Choose a strong combination.</p>
                </div>
                
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-premium-primary py-2.5">
                            <i class="bi bi-shield-lock-fill me-2"></i> Update Password
                        </button>
                        <a href="{% url 'accounts:profile' %}" class="btn btn-light border py-2">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
