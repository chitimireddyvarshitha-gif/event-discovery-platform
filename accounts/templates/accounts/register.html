{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Create Account — EventHub{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-4">
    <div class="col-md-8 col-lg-6">
        <div class="card card-premium p-4 border-0">
            <div class="card-body">
                <div class="text-center mb-4">
                    <div class="bg-primary bg-opacity-10 text-primary p-3 rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
                        <i class="bi bi-person-plus-fill fs-3"></i>
                    </div>
                    <h2 class="h3 fw-extrabold text-dark">Join EventHub</h2>
                    <p class="text-muted small">Choose your role and register to begin your journey</p>
                </div>
                
                <form method="post" class="form-floating-custom">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-premium-primary w-100 py-3 mt-3 shadow">
                        <i class="bi bi-check-circle-fill me-2"></i> Register Account
                    </button>
                </form>
                
                <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-10">
                    <p class="text-muted small mb-0">Already have an account? <a href="{% url 'accounts:login' %}" class="fw-semibold text-decoration-none text-primary">Log in here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
