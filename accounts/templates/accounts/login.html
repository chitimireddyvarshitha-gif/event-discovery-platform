{% extends 'base.html' %}

{% block title %}Login — EventHub{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-5">
    <div class="col-md-6 col-lg-5">
        <div class="card card-premium p-4 border-0">
            <div class="card-body">
                <div class="text-center mb-4">
                    <div class="bg-primary bg-opacity-10 text-primary p-3 rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
                        <i class="bi bi-shield-lock-fill fs-3"></i>
                    </div>
                    <h2 class="h3 fw-extrabold text-dark">Welcome Back</h2>
                    <p class="text-muted small">Login to explore events and manage your bookings</p>
                </div>
                
                <form method="post" class="form-floating-custom">
                    {% csrf_token %}
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="username" name="username" placeholder="Username" required>
                        <label for="username" class="text-muted"><i class="bi bi-person me-2"></i>Username</label>
                    </div>
                    <div class="form-floating mb-4">
                        <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                        <label for="password" class="text-muted"><i class="bi bi-key me-2"></i>Password</label>
                    </div>
                    
                    <button type="submit" class="btn btn-premium-primary w-100 py-3 mb-3">
                        <i class="bi bi-box-arrow-in-right me-2"></i> Log In
                    </button>
                </form>
                
                <div class="text-center mt-3 pt-3 border-top border-secondary border-opacity-10">
                    <p class="text-muted small mb-0">Don't have an account? <a href="{% url 'accounts:register' %}" class="fw-semibold text-decoration-none text-primary">Sign up today</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
